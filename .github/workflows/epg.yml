name: Build and publish Sports EPG v3.18

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: ["main"]
    paths:
      - "epg_generator.py"
      - "channels.yaml"
      - "translations.yaml"
      - "leagues.yaml"
      - "live_overrides.yaml"
      - "requirements.txt"
      - "build_health_seed.json"
      - "build_health_trend_seed.json"
      - "build_history_seed.json"
      - ".github/workflows/epg.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Restore Sports EPG caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: sportguide-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sportguide-${{ runner.os }}-
      - run: python verify_config.py
      - run: python smoke_test.py
      - run: python quality_test.py
      - run: python integration_test.py
      - run: python regression_test.py
      - run: python v34_test.py
      - run: python v35_test.py
      - run: python v36_test.py
      - run: python v37_test.py
      - run: python v38_test.py
      - run: python v39_test.py
      - run: python v310_test.py
      - run: python v311_test.py
      - run: python v312_test.py
      - run: python v313_test.py
      - run: python v314_test.py
      - run: python v315_test.py
      - run: python v316_test.py
      - run: python v317_test.py
      - run: python v318_test.py
          python v318_livefix_test.py
      - run: python v318_sport_icons_test.py
      - run: python v318_canal_extra_test.py
      - run: python v318_plusx_test.py
      - run: python v318_plusx_expand_test.py
      - run: python epg_generator.py

      - name: Prepare GitHub Pages
        run: |
          cp docs/status.html docs/index.html
          touch docs/.nojekyll
          ls -lah docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
